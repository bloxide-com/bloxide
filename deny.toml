# cargo-deny configuration: license, advisory, and dependency auditing.

[licenses]
# License allowlist for all workspace dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
]
# Confidence threshold for license detection (0.0 - 1.0).
confidence-threshold = 0.8
# Crates whose license situation is clarified here rather than via allowlist.
clarify = []
exceptions = []

[advisories]
# RUSTSEC advisory checking. No ignored advisories — resolve, don't ignore.
ignore = []

[bans]
# Warn on duplicate dependency versions (multiple versions of the same crate).
multiple-versions = "warn"
# Warn on wildcard dependencies.
wildcards = "allow" # workspace-inherited versions are centrally managed

[sources]
# Only crates.io by default; git/registry sources must be opted into.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
