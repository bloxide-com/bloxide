[system]
runtime = "tokio"
name = "tokio-pool-demo"

[[actors]]
name = "pool"
blox = "pool-blox"
impl_crate = "tokio_pool_demo_impl"
features = ["dynamic"]

  [actors.inject]
  self_ref = { source = "self" }
  spawn_fn = { source = "factory", crate = "tokio_pool_demo_impl", function = "spawn_worker" }
  spawn_ref = { source = "actor", actor = "supervisor", field = "control" }
  notify_ref = { source = "actor", actor = "supervisor", field = "notify" }
  spawn_reply_ref = { source = "self_secondary", index = 1 }

  # Bootstrap: send 3 SpawnWorker messages to trigger Idle→Active→AllDone
  [[actors.bootstrap]]
  message = "PoolMsg::SpawnWorker"
  payload = { task_id = 0 }

  [[actors.bootstrap]]
  message = "PoolMsg::SpawnWorker"
  payload = { task_id = 1 }

  [[actors.bootstrap]]
  message = "PoolMsg::SpawnWorker"
  payload = { task_id = 2 }

[[supervision]]
supervisor = "bloxide-supervisor"
strategy = "when_all_done"
children = ["pool"]

  [supervision.policies]
  pool = { stop = true }

# Worker is kind = "dynamic" — spawned at runtime by the pool via factory
# injection. It gets a concrete spec generated at the system level, but no
# channels/task/bootstrap in main.rs. The impl crate (tokio_pool_demo_impl)
# provides the spawn_worker factory, injected into the pool's spawn_fn (see
# [actors.inject] above): it constructs the worker context and machine at
# spawn time, and is generic over the spec type — main.rs monomorphizes it
# with the system-level concrete spec.
[[actors]]
name = "worker"
blox = "worker-blox"
impl_crate = "tokio_pool_demo_impl"
kind = "dynamic"
