[package]
name = "bloxide"
version.workspace = true
edition.workspace = true
publish = false
description = "Workspace host crate for bloxide apps and tools"

[workspace]
members = [
    "crates/bloxide-core",
    "crates/bloxide-log",
    "crates/bloxide-macros",
    "crates/bloxide-child-management",
    "crates/bloxide-spawn",
    "crates/bloxide-supervisor",
    "crates/bloxide-peers",
    "crates/bloxide-timer",
    "runtimes/bloxide-embassy",
    "runtimes/bloxide-tokio",
    "runtimes/bloxide-test-runtime",
    "crates/context/blox-ctx-noop",
    "crates/context/blox-ctx-ping-pong",
    "crates/context/blox-ctx-pool-ref",
    "crates/context/blox-ctx-rounds",
    "crates/context/blox-ctx-ticks",
    "crates/messages/ping-pong-messages",
    "crates/messages/pool-messages",
    "crates/messages/counter-messages",
    "crates/messages/bhsm-tst-messages",
    "crates/tools/bloxide-codegen",
    "crates/tools/cargo-blox",
    "tools/bloxide-viz-export",
]
# tokio-pool-demo-impl path-depends into target/bloxide-generated/ (produced by
# `cargo blox generate`), so it cannot be a root member — the root workspace
# must load on a fresh clone, before the generated tree exists. Cargo also
# forbids it as a member of the generated workspace (members must be
# hierarchically below the workspace root), so it builds as a path dependency
# of the generated example crates; `cargo blox test` runs its tests via
# --manifest-path (see bloxide-codegen's impl_crate_dirs).
exclude = ["crates/impl/tokio-pool-demo-impl"]
resolver = "2"

# cargo blox ci configuration: the no_std audit matrix. Members listed here
# must compile with --no-default-features against nostd-target.
[workspace.metadata.bloxide-ci]
nostd-target = "riscv32imc-unknown-none-elf"
nostd-members = [
    "bloxide-core",
    "bloxide-log",
    "bloxide-timer",
    "bloxide-supervisor",
    "bloxide-spawn",
    "bloxide-child-management",
    "bloxide-peers",
    "ping-pong-messages",
    "pool-messages",
    "counter-messages",
    "bhsm-tst-messages",
]

# Shared lint configuration. Member crates opt in with:
#   [lints]
#   workspace = true
# Kept conservative on purpose; tighten per-crate as needed.
[workspace.lints.rust]
unsafe_code = "warn"

[workspace.package]
version = "0.0.3"
edition = "2021"
repository = "https://github.com/bloxide-com/bloxide"
license = "MIT"
readme = "README.md"
authors = ["Bloxide Contributors"]
keywords = ["actor", "hsm", "state-machine", "embedded", "no_std", "async"]
categories = ["embedded", "no-std", "asynchronous", "rust-patterns"]

[workspace.dependencies]
bloxide-core = { path = "crates/bloxide-core" }
bloxide-log = { path = "crates/bloxide-log" }
bloxide-macros = { path = "crates/bloxide-macros" }
bloxide-child-management = { path = "crates/bloxide-child-management" }
bloxide-spawn = { path = "crates/bloxide-spawn" }
bloxide-supervisor = { path = "crates/bloxide-supervisor" }
bloxide-peers = { path = "crates/bloxide-peers" }
bloxide-timer = { path = "crates/bloxide-timer" }
bloxide-embassy = { path = "runtimes/bloxide-embassy" }
bloxide-tokio = { path = "runtimes/bloxide-tokio" }
bloxide-test-runtime = { path = "runtimes/bloxide-test-runtime" }
blox-ctx-noop = { path = "crates/context/blox-ctx-noop" }
blox-ctx-ping-pong = { path = "crates/context/blox-ctx-ping-pong" }
blox-ctx-pool-ref = { path = "crates/context/blox-ctx-pool-ref" }
blox-ctx-rounds = { path = "crates/context/blox-ctx-rounds" }
blox-ctx-ticks = { path = "crates/context/blox-ctx-ticks" }
ping-pong-messages = { path = "crates/messages/ping-pong-messages" }
pool-messages = { path = "crates/messages/pool-messages" }
counter-messages = { path = "crates/messages/counter-messages" }
bhsm-tst-messages = { path = "crates/messages/bhsm-tst-messages" }
tokio-pool-demo-impl = { path = "crates/impl/tokio-pool-demo-impl" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
static_cell = "2"

[dev-dependencies]
bloxide-core = { workspace = true, features = ["std", "tracing"] }
bloxide-embassy = { workspace = true, features = ["std"] }
bloxide-tokio = { workspace = true }
bloxide-log = { workspace = true, features = ["log"] }
bloxide-timer = { workspace = true, features = ["std"] }
bhsm-tst-messages = { workspace = true }
ping-pong-messages = { workspace = true }
pool-messages = { workspace = true }
counter-messages = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
embassy-executor = { version = "0.9", features = ["arch-std", "executor-thread"] }
embassy-sync = { version = "0.7" }
embassy-time = { version = "0.5", features = ["std", "generic-queue-8"] }
critical-section = { version = "1.2", features = ["std"] }
static_cell = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
