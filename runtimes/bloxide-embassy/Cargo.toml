[package]
name = "bloxide-embassy"
version.workspace = true
edition.workspace = true
description = "Embassy runtime implementation for bloxide"
repository.workspace = true
license.workspace = true

[dependencies]
bloxide-core = { workspace = true }
bloxide-child-management = { workspace = true }
bloxide-macros = { workspace = true }
bloxide-timer = { workspace = true }
embassy-futures = "0.1"
embassy-sync = { version = "0.7" }
embassy-time = { version = "0.5" }
embassy-executor = { version = "0.9", features = ["executor-thread"] }
futures-core = { version = "0.3", default-features = false }

[features]
std = ["bloxide-core/std", "bloxide-child-management/std", "bloxide-timer/std"]

# Host test builds link embassy crates that call critical-section. The library
# itself deliberately ships no impl (that choice belongs to the final binary),
# so provide the std impl for this crate's tests only.
[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
# The timer service tests need a working `embassy_time::Timer`: the `std`
# feature provides a self-initializing host time driver, and `generic-queue-8`
# selects the generic timer queue (the default integrated queue would drag in
# embassy-executor internals needing an arch backend). Dev-dependency only —
# production (no_std) builds bring their own driver.
embassy-time = { version = "0.5", features = ["std", "generic-queue-8"] }
