[package]
name = "bloxide-embassy"
version.workspace = true
edition.workspace = true
description = "Embassy runtime implementation for bloxide"
repository.workspace = true
license.workspace = true

[dependencies]
bloxide-core = { workspace = true, features = ["alloc"] }
bloxide-child-management = { workspace = true, features = ["alloc"] }
bloxide-macros = { workspace = true }
bloxide-timer = { workspace = true }
bloxide-log = { workspace = true }
embassy-futures = "0.1"
embassy-sync = { version = "0.7" }
embassy-time = { version = "0.5" }
embassy-executor = { version = "0.9", features = ["executor-thread"] }
futures-core = { version = "0.3", default-features = false }

[features]
std = ["bloxide-core/std", "bloxide-child-management/std", "bloxide-timer/std"]

# Host test builds link embassy crates that call critical-section. The library
# itself deliberately ships no impl (that choice belongs to the final binary),
# so provide the std impl for this crate's tests only.
[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
