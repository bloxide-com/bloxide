[system]
runtime = "tokio"
name = "tokio-demo"

[[actors]]
name = "timer"
blox = "bloxide-timer"
kind = "timer"

[[actors]]
name = "ping"
blox = "ping-blox"

  [actors.inject]
  self_ref = { source = "self" }
  peer_ref = { source = "actor", actor = "pong" }
  timer_ref = { source = "actor", actor = "timer" }

[[actors]]
name = "pong"
blox = "pong-blox"

  [actors.inject]
  peer_ref = { source = "actor", actor = "ping" }

[[supervision]]
supervisor = "bloxide-supervisor"
strategy = "when_any_done"
children = ["ping", "pong"]

  [supervision.policies]
  ping = { stop = true }
  pong = { stop = true }
