# Copyright 2025 Bloxide, all rights reserved
name: Lint and Test Rust Backend

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - ".github/**"
      - "crates/**"
      - "runtimes/**"
      - "examples/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:

  ci:
    name: CI (cargo blox ci)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy
          rustup target add riscv32imc-unknown-none-elf

      # Installed from the current checkout so the invoked binary always
      # matches the sources under test.
      - name: Install cargo-blox
        run: cargo install --path crates/tools/cargo-blox

      # Generated artifacts (src/generated/, apps/*/main.rs, apps/*/Cargo.toml)
      # are gitignored — the workspace does not compile from a pristine
      # checkout until codegen runs. Generate BEFORE any build/test step.
      - name: Generate code (cargo blox generate)
        run: cargo blox generate

      - name: Cargo Build
        run: cargo build

      # Single source of truth for the check matrix: auto-discovered from the
      # workspace (see #133). Covers: cargo check feature matrix, no_std
      # audit, tests, fmt, clippy, doc build, copyright compliance.
      - name: cargo blox ci
        run: cargo blox ci

  lint:
    name: Lint (cargo blox lint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # blox.toml validation + spec conformance + dead doc references.
      # cargo run builds cargo-blox from the current sources.
      - name: cargo blox lint
        run: cargo run -p cargo-blox -- blox lint

  feature-tests:
    name: Feature-specific tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Generate first: the workspace does not compile from a pristine
      # checkout (generated artifacts are gitignored).
      - name: Generate code (cargo blox generate)
        run: cargo run -p cargo-blox -- blox generate

      - name: Run optional-feature tests
        run: |
          cargo test -p bloxide-core --features tracing
          cargo test --workspace --features bloxide-log/log

  deny:
    name: Dependency audit (cargo-deny)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: cargo deny check
        run: cargo deny check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          cargo install cargo-tarpaulin

      - name: Show toolchain information
        run: |
          rustup toolchain list
          cargo --version

      # Generate first: the workspace does not compile from a pristine
      # checkout (generated artifacts are gitignored).
      - name: Generate code (cargo blox generate)
        run: cargo run -p cargo-blox -- blox generate

      - name: Run tests and report code coverage
        run: |
          RUSTC_BOOTSTRAP=1 cargo tarpaulin -o xml -o lcov -o html --doc --tests

      - name: Upload coverage report (xml)
        uses: actions/upload-artifact@v4
        with:
          name: Test Coverage Results (xml)
          path: cobertura.xml

      - name: Upload coverage report (lcov)
        uses: actions/upload-artifact@v4
        with:
          name: Test Coverage Results (lcov)
          path: lcov.info

      - name: Upload coverage report (html)
        uses: actions/upload-artifact@v4
        with:
          name: Test Coverage Results (html)
          path: tarpaulin-report.html

  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Generate first: the workspace does not compile from a pristine
      # checkout (generated artifacts are gitignored).
      - name: Generate code (cargo blox generate)
        run: cargo run -p cargo-blox -- blox generate

      - name: Create Documentation for bloxide
        working-directory: ${{github.workspace}}
        run: RUSTDOCFLAGS=-Dwarnings cargo doc --workspace --no-deps

  round-trip-verify:
    name: Round-trip Verification (blox.toml → codegen → viz-export → JSON)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Run round-trip integration tests
        run: |
          cargo test -p bloxide-viz-export --test round_trip

      - name: Run cargo blox verify
        run: |
          cargo run -p cargo-blox -- blox verify
