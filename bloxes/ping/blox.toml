# Copyright 2025 Bloxide, all rights reserved
[actor]
name = "Ping"

# Crate packaging for the materialized crate
# (target/bloxide-generated/crates/ping-blox). Dependencies are derived from
# the message paths / context imports / action crates below; only features
# and dev-dependencies need declaring here.
[package]
description = "Ping actor blox — runtime-agnostic"

[package.features]
default = ["std"]
std = ["bloxide-core/std", "bloxide-timer/std"]

# Dev-dependencies of the integration tests in tests/ (integration tests do
# not see the crate's regular dependencies — declare everything they import).
[package.dev-dependencies]
bloxide-core = { features = ["std"] }
bloxide-timer = { features = ["std"] }
ping-pong-messages = {}
bloxide-test-runtime = {}

# Crate-root constants (referenced by guards via spec_imports `crate::...`).
[[consts]]
name = "MAX_ROUNDS"
ty = "u8"
value = "5"

[[consts]]
name = "PAUSE_AT_ROUND"
ty = "u8"
value = "2"
doc = "After receiving `Pong(PAUSE_AT_ROUND)`, Active transitions to Paused. `Paused::on_entry` schedules a resume timer whose duration is derived from the round number (see `schedule_resume`: 2000 + round × 500 ms)."

[context]
name = "PingCtx"
generics = "<R: BloxRuntime>"
on_init = "ctx.round = 0; ctx.current_timer = None;"
imports = [
    "ping_pong_messages::PingPongMsg",
    "bloxide_timer::{TimerCommand, TimerId}",
]

# Accessor traits removed — fields are now plain struct fields.
[[context.uses]]
field = "peer_ref"
field_type = "ActorRef<PingPongMsg, R>"
role = "ctor"

[[context.uses]]
field = "self_ref"
field_type = "ActorRef<PingPongMsg, R>"
role = "ctor"

# Timer ref — plain struct field
[[context.uses]]
field = "timer_ref"
field_type = "ActorRef<TimerCommand, R>"
role = "ctor"

# State fields (moved from B into Ctx)
[[context.fields]]
name = "current_timer"
type = "Option<TimerId>"

[[context.fields]]
name = "round"
type = "u32"

# --- Action declarations (Phase 3 system codegen) ---

[[context.actions]]
name = "increment_round"
crate = "blox_ctx_rounds"
fields = ["round:mut"]
impl_required = false
returns = "ActionResult"

[[context.actions]]
name = "send_initial_ping"
crate = "blox_ctx_ping_pong"
fields = ["self_id", "peer_ref:ref", "round:mut"]
impl_required = false
returns = "ActionResult"

[[context.actions]]
name = "forward_ping"
fn_name = "send_ping"
crate = "blox_ctx_ping_pong"
fields = ["self_id", "peer_ref:ref", "round"]
impl_required = false
returns = "ActionResult"

[[context.actions]]
name = "schedule_pause_timer"
fn_name = "schedule_resume"
crate = "blox_ctx_ping_pong"
fields = ["self_id", "self_ref:ref", "timer_ref:ref", "round", "current_timer:mut"]
impl_required = false
returns = "ActionResult"

[[context.actions]]
name = "cancel_pause_timer"
fn_name = "cancel_timer_by_id"
crate = "bloxide_timer"
module = "actions"
fields = ["self_id", "timer_ref:ref", "current_timer:mut"]
impl_required = false
returns = "ActionResult"

[event]
name = "PingEvent"

[[event.mailboxes]]
variant = "Msg"
message = "PingPongMsg"
message_path = "ping_pong_messages::PingPongMsg"

[topology]
spec_imports = [
    "bloxide_core::transition::ActionResult",
    "crate::{MAX_ROUNDS, PAUSE_AT_ROUND}",
]

[[topology.states]]
name = "Operating"
composite = true

[[topology.states]]
name = "Active"
parent = "Operating"
initial = true

[[topology.states]]
name = "Paused"
parent = "Operating"

[[topology.states]]
name = "Error"
error = true

# --- Declarative transitions ---

# Operating: composite state, catches Pong to prevent bubbling
[[topology.transitions]]
state = "Operating"
event = "PingPongMsg::Pong(_)"
target = "stay"

# Active: entry sends the first ping (round 0→1); each Pong advances the round
# and forwards exactly one ping for the new round (stay — no re-entry).
[[topology.entry]]
state = "Active"
actions = ["Self::send_initial_ping"]

[[topology.transitions]]
state = "Active"
event = "PingPongMsg::Pong(_)"
target = "stay"
actions = ["Self::increment_round", "Self::forward_ping"]

[[topology.transitions.guards]]
condition = "results.any_failed()"
target = "Error"

[[topology.transitions.guards]]
condition = "ctx.round >= MAX_ROUNDS as u32"
target = "done"

[[topology.transitions.guards]]
condition = "ctx.round == PAUSE_AT_ROUND as u32"
target = "Paused"

# Paused: entry schedules timer, exit cancels it; Resume advances the round
# and forwards one ping, re-entering Active
[[topology.entry]]
state = "Paused"
actions = ["Self::schedule_pause_timer"]

[[topology.exit]]
state = "Paused"
actions = ["Self::cancel_pause_timer"]

[[topology.transitions]]
state = "Paused"
event = "PingPongMsg::Resume(_)"
target = "Active"
actions = ["Self::increment_round", "Self::forward_ping"]

# Error: entry logs error
[[topology.entry]]
state = "Error"
actions = []
