[actor]
name = "Worker"

# Crate packaging for the materialized crate
# (target/bloxide-generated/crates/worker-blox). Dependencies are derived from
# the message paths / context imports / action crates below; only features
# and dev-dependencies need declaring here.
[package]
description = "Worker actor blox for the pool example — runtime-agnostic"

[package.features]
default = ["std"]
std = ["bloxide-core/std"]

# Dev-dependencies of the integration tests in tests/ (integration tests do
# not see the crate's regular dependencies — declare everything they import).
[package.dev-dependencies]
bloxide-core = { features = ["std"] }
bloxide-peers = {}
pool-messages = {}
bloxide-test-runtime = {}

[event]
name = "WorkerEvent"
generics = "<R: BloxRuntime>"
derives = []

[[event.mailboxes]]
variant = "Ctrl"
message = "PeerCtrl<WorkerMsg>"
message_path = "bloxide_peers::PeerCtrl<pool_messages::WorkerMsg, R>"

[[event.mailboxes]]
variant = "Msg"
message = "WorkerMsg"
message_path = "pool_messages::WorkerMsg"

[topology]

[[topology.states]]
name = "Waiting"
initial = true

[context]
name = "WorkerCtx"
generics = "<R: BloxRuntime>"
on_init = "ctx.task_id = 0; ctx.result = 0; ctx.peers.clear();"
imports = [
    "pool_messages::{PoolMsg, WorkerMsg}",
    "alloc::vec::Vec",
]

# pool_ref is a constructor parameter (passed to WorkerCtx::new),
# not a state field. Accessed directly as ctx.pool_ref.
[[context.uses]]
field = "pool_ref"
field_type = "ActorRef<PoolMsg, R>"
role = "ctor"

# State fields — plain struct fields, zero-initialized via `Default` in `Ctx::new`.
[[context.fields]]
name = "task_id"
type = "u32"

[[context.fields]]
name = "result"
type = "u32"

[[context.fields]]
name = "peers"
type = "Vec<ActorRef<WorkerMsg, R>>"

# --- Action declarations (Phase 3 system codegen) ---

[[context.actions]]
name = "handle_ctrl"
crate = "bloxide_peers"
fn_name = "apply_peer_control"
fields = ["peers:mut"]
event_payload = "ctrl"
impl_required = false
returns = "ActionResult"

[[context.actions]]
name = "process_work"
fields = ["task_id:mut", "result:mut"]
event_payload = "do_work"
impl_required = true
returns = "ActionResult"

[[context.actions]]
name = "do_broadcast"
crate = "blox_ctx_pool_ref"
fn_name = "broadcast_result"
fields = ["self_id", "peers:ref", "result"]
impl_required = false
returns = "ActionResult"

[[context.actions]]
name = "do_notify_pool"
crate = "blox_ctx_pool_ref"
fn_name = "notify_pool_done"
fields = ["self_id", "pool_ref:ref", "task_id", "result"]
impl_required = false
returns = "ActionResult"

# --- Declarative transitions ---

# Waiting: entry logs; handles ctrl (AddPeer/RemovePeer), DoWork → done, PeerResult stays
[[topology.entry]]
state = "Waiting"
actions = []

[[topology.transitions]]
state = "Waiting"
event = "PeerCtrl::AddPeer(_) | PeerCtrl::RemovePeer(_)"
target = "stay"
actions = ["Self::handle_ctrl"]

[[topology.transitions]]
state = "Waiting"
event = "WorkerMsg::DoWork(_)"
target = "done"
actions = ["Self::process_work", "Self::do_broadcast", "Self::do_notify_pool"]

[[topology.transitions]]
state = "Waiting"
event = "WorkerMsg::PeerResult(_)"
target = "stay"

