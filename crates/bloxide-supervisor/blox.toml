[actor]
name = "Supervisor"

# ── Context struct ───────────────────────────────────────────────────────────
# Single unified variant — no dynamic/non-dynamic split.
# The event enum is now generated by the codegen (standard [event] section).

[context]
name = "SupervisorCtx"
generics = "<R: BloxRuntime>"
# No `on_init`: Reset skips Init entirely (engine goes straight to
# initial_state), and Running's on_entry (start_children) clears the child
# counters on every entry — initial Start, re-Start after Stop, and Reset
# alike — so Init-entry cleanup can never observe stale counters.

# Explicit imports — only non-framework crates. Framework types (ActorId,
# ActorRef, BloxRuntime) are auto-detected by the codegen from field types.
imports = [
    "bloxide_core::lifecycle::ChildLifecycleEvent",
    "bloxide_child_management::ChildGroup",
]

# Extra impl blocks emitted after the struct. {ctx} is replaced with the
# actual ctx type (SupervisorCtx<R>).
extra_impls = [
    "{ctx} { pub fn all_children_stopped(&self) -> bool { self.children.all_stopped() } }",
]

# ── Action declarations ─────────────────────────────────────────────────────
# Each action is a free function in crate::actions that takes concrete params.
# The codegen generates wrapper closures that extract ctx fields and call them.
#
# `flush_pending` is the first action on nearly every transition: commands
# lost to a full channel are retried on every event pass (confirm-before-
# record), and a Closed channel observed while flushing marks the child Gone
# — terminal evidence the guards read directly from the child group.

[[context.actions]]
name = "start_children"
crate = "bloxide_child_management"
module = "actions"
fields = ["self_id", "children:mut"]
returns = "ActionResult"

[[context.actions]]
name = "stop_all_children"
crate = "bloxide_child_management"
module = "actions"
fields = ["self_id", "children:mut"]
returns = "ActionResult"

[[context.actions]]
name = "flush_pending"
crate = "bloxide_child_management"
module = "actions"
fields = ["self_id", "children:mut"]
returns = "ActionResult"

[[context.actions]]
name = "handle_done_or_failed"
crate = "bloxide_child_management"
module = "actions"
fields = ["self_id", "children:mut", "child_notify:ref"]
event_payload = "ev"
returns = "ActionResult"

[[context.actions]]
name = "record_started"
crate = "bloxide_child_management"
module = "actions"
fields = ["self_id", "children:mut"]
event_payload = "ev"
returns = "ActionResult"

[[context.actions]]
name = "record_stopped"
crate = "bloxide_child_management"
module = "actions"
fields = ["self_id", "children:mut"]
event_payload = "ev"
returns = "ActionResult"

[[context.actions]]
name = "record_failed"
crate = "bloxide_child_management"
module = "actions"
fields = ["self_id", "children:mut"]
event_payload = "ev"
returns = "ActionResult"

[[context.actions]]
name = "record_aborted"
crate = "bloxide_child_management"
module = "actions"
fields = ["self_id", "children:mut"]
event_payload = "ev"
returns = "ActionResult"

[[context.actions]]
name = "record_killed"
crate = "bloxide_child_management"
module = "actions"
fields = ["self_id", "children:mut"]
event_payload = "ev"
returns = "ActionResult"

[[context.actions]]
name = "record_alive"
crate = "bloxide_child_management"
module = "actions"
fields = ["children:mut"]
event_payload = "ev"
returns = "ActionResult"

[[context.actions]]
name = "deregister_done"
crate = "bloxide_child_management"
module = "actions"
fields = ["self_id", "children:mut"]
event_payload = "ev"
returns = "ActionResult"

[[context.actions]]
name = "register_child"
crate = "bloxide_child_management"
module = "actions"
fields = ["self_id", "children:mut"]
event_payload = "ctrl"
returns = "ActionResult"

[[context.actions]]
name = "handle_register_dynamic_child"
crate = "bloxide_child_management"
module = "actions"
fields = ["self_id", "children:mut"]
event_payload = "ctrl"
returns = "ActionResult"

[[context.actions]]
name = "handle_watchdog_tick"
crate = "bloxide_child_management"
module = "actions"
fields = ["self_id", "children:mut", "child_notify:ref"]
event_payload = "ctrl"
returns = "ActionResult"

# ── Event type (standard codegen-generated event enum) ──────────────────────

[event]
name = "SupervisorEvent"
generics = "<R: BloxRuntime>"

[[event.mailboxes]]
variant = "Child"
message = "ChildLifecycleEvent"
message_path = "bloxide_core::lifecycle::ChildLifecycleEvent"
# Full variant set of the message enum. Lets the codegen omit a state's
# `SupervisorEvent::Child(_)` catch-all when the state's specific rules
# already cover every variant (unreachable dead code); the catch-alls stay
# declared below so a newly added variant automatically re-enables them in
# states that lack a matching rule.
variants = ["Started", "Failed", "Stopped", "Done", "Aborted", "Killed", "Alive"]

[[event.mailboxes]]
variant = "Control"
message = "ChildCtrl"
message_path = "bloxide_child_management::control::ChildCtrl<R>"
variants = ["RegisterChild", "RegisterDynamicChild", "WatchdogTick"]

# ── Context fields (via composable context crates) ──────────────────────────

# children: ChildGroup<R> from bloxide-child-management
[[context.uses]]
field = "children"
field_type = "ChildGroup<R>"
role = "ctor"

# child_notify: ActorRef<ChildLifecycleEvent, R> from bloxide-child-management
[[context.uses]]
field = "child_notify"
field_type = "ActorRef<ChildLifecycleEvent, R>"
role = "ctor"

# ── Topology ─────────────────────────────────────────────────────────────────
# 2 states, fully declarative — no handler_fns.

[topology]

# Running state — lifecycle handling
#
# Shutdown guard chain (ordered): if the group is already fully terminal after
# the action ran — all children Stopped/Aborted/Killed/Gone, or empty after
# Done-deregistration — there is nothing left to stop and the supervisor
# self-stops immediately ("stop"). Otherwise, when the group's shutdown
# condition holds (ctx.children.should_begin_shutdown()), it enters
# ShuttingDown to stop the remaining live children. The guard reads the child
# group directly, so terminal evidence recorded by ANY action on the pass —
# including a Closed channel observed by flush_pending — is seen and can never
# be overwritten by a later action. The direct-stop path is what makes
# Done-of-last-child and all-task-gone cases complete instead of wedging in
# an event-less ShuttingDown.
[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Child(Envelope(_, ChildLifecycleEvent::Stopped { .. }))"
target = "stay"
actions = ["Self::flush_pending", "Self::handle_done_or_failed"]

[[topology.transitions.guards]]
condition = "ctx.all_children_stopped()"
target = "stop"

[[topology.transitions.guards]]
condition = "ctx.children.should_begin_shutdown()"
target = "ShuttingDown"

[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Child(Envelope(_, ChildLifecycleEvent::Failed { .. }))"
target = "stay"
actions = ["Self::flush_pending", "Self::handle_done_or_failed"]

[[topology.transitions.guards]]
condition = "ctx.all_children_stopped()"
target = "stop"

[[topology.transitions.guards]]
condition = "ctx.children.should_begin_shutdown()"
target = "ShuttingDown"

[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Child(Envelope(_, ChildLifecycleEvent::Started { .. }))"
target = "stay"
actions = ["Self::flush_pending", "Self::record_started"]

# flush_pending may have observed a Closed channel (child Gone) on this very
# pass — the guard chain must see that terminal evidence immediately; it
# cannot wait for a later event.
[[topology.transitions.guards]]
condition = "ctx.all_children_stopped()"
target = "stop"

[[topology.transitions.guards]]
condition = "ctx.children.should_begin_shutdown()"
target = "ShuttingDown"

[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Child(Envelope(_, ChildLifecycleEvent::Aborted { .. }))"
target = "stay"
actions = ["Self::flush_pending", "Self::record_aborted"]

[[topology.transitions.guards]]
condition = "ctx.all_children_stopped()"
target = "stop"

[[topology.transitions.guards]]
condition = "ctx.children.should_begin_shutdown()"
target = "ShuttingDown"

[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Child(Envelope(_, ChildLifecycleEvent::Killed { .. }))"
target = "stay"
actions = ["Self::flush_pending", "Self::record_killed"]

[[topology.transitions.guards]]
condition = "ctx.all_children_stopped()"
target = "stop"

[[topology.transitions.guards]]
condition = "ctx.children.should_begin_shutdown()"
target = "ShuttingDown"

[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Child(Envelope(_, ChildLifecycleEvent::Alive { .. }))"
target = "stay"
actions = ["Self::flush_pending", "Self::record_alive"]

[[topology.transitions.guards]]
condition = "ctx.all_children_stopped()"
target = "stop"

[[topology.transitions.guards]]
condition = "ctx.children.should_begin_shutdown()"
target = "ShuttingDown"

[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Child(Envelope(_, ChildLifecycleEvent::Done { .. }))"
target = "stay"
actions = ["Self::flush_pending", "Self::deregister_done"]

[[topology.transitions.guards]]
condition = "ctx.all_children_stopped()"
target = "stop"

[[topology.transitions.guards]]
condition = "ctx.children.should_begin_shutdown()"
target = "ShuttingDown"

[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Control(Envelope(_, ChildCtrl::RegisterChild(_)))"
target = "stay"
actions = ["Self::flush_pending", "Self::register_child"]

[[topology.transitions.guards]]
condition = "ctx.all_children_stopped()"
target = "stop"

[[topology.transitions.guards]]
condition = "ctx.children.should_begin_shutdown()"
target = "ShuttingDown"

[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Control(Envelope(_, ChildCtrl::RegisterDynamicChild(_)))"
target = "stay"
actions = ["Self::flush_pending", "Self::handle_register_dynamic_child"]

[[topology.transitions.guards]]
condition = "ctx.all_children_stopped()"
target = "stop"

[[topology.transitions.guards]]
condition = "ctx.children.should_begin_shutdown()"
target = "ShuttingDown"

[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Control(Envelope(_, ChildCtrl::WatchdogTick))"
target = "stay"
actions = ["Self::flush_pending", "Self::handle_watchdog_tick"]

[[topology.transitions.guards]]
condition = "ctx.all_children_stopped()"
target = "stop"

[[topology.transitions.guards]]
condition = "ctx.children.should_begin_shutdown()"
target = "ShuttingDown"

# Running state — catch-alls. Declared for robustness, but OMITTED from the
# generated spec: the rules above cover every declared ChildLifecycleEvent
# and ChildCtrl variant, so these share the event_tag of the specific rules,
# are evaluated last, and can never match. The codegen reinstates them
# automatically if coverage ever becomes partial (e.g. a new variant).
[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Child(_)"
target = "stay"

[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Control(_)"
target = "stay"

# ShuttingDown state — record ALL terminal evidence and wait for every child.
# There is no timeout by design (wait-forever): a genuinely stuck child cannot
# be killed on static runtimes anyway. Every terminal signal counts toward
# completion — Stopped, Done, Failed (parked-error, task alive), Aborted,
# Killed, and Gone (observed via Closed channel while flushing).
[[topology.transitions]]
state = "ShuttingDown"
event = "SupervisorEvent::Child(Envelope(_, ChildLifecycleEvent::Stopped { .. }))"
target = "stay"
actions = ["Self::flush_pending", "Self::record_stopped"]

[[topology.transitions.guards]]
condition = "ctx.all_children_stopped()"
target = "stop"

[[topology.transitions]]
state = "ShuttingDown"
event = "SupervisorEvent::Child(Envelope(_, ChildLifecycleEvent::Done { .. }))"
target = "stay"
actions = ["Self::flush_pending", "Self::deregister_done"]

[[topology.transitions.guards]]
condition = "ctx.all_children_stopped()"
target = "stop"

[[topology.transitions]]
state = "ShuttingDown"
event = "SupervisorEvent::Child(Envelope(_, ChildLifecycleEvent::Failed { .. }))"
target = "stay"
actions = ["Self::flush_pending", "Self::record_failed"]

[[topology.transitions.guards]]
condition = "ctx.all_children_stopped()"
target = "stop"

[[topology.transitions]]
state = "ShuttingDown"
event = "SupervisorEvent::Child(Envelope(_, ChildLifecycleEvent::Aborted { .. }))"
target = "stay"
actions = ["Self::flush_pending", "Self::record_aborted"]

[[topology.transitions.guards]]
condition = "ctx.all_children_stopped()"
target = "stop"

[[topology.transitions]]
state = "ShuttingDown"
event = "SupervisorEvent::Child(Envelope(_, ChildLifecycleEvent::Killed { .. }))"
target = "stay"
actions = ["Self::flush_pending", "Self::record_killed"]

[[topology.transitions.guards]]
condition = "ctx.all_children_stopped()"
target = "stop"

# WatchdogTick in ShuttingDown: only flush pending commands (no health
# checks — children are being stopped, not monitored). The flush can complete
# the shutdown (pending Stop delivered, or a Closed channel marks Gone).
[[topology.transitions]]
state = "ShuttingDown"
event = "SupervisorEvent::Control(Envelope(_, ChildCtrl::WatchdogTick))"
target = "stay"
actions = ["Self::flush_pending"]

[[topology.transitions.guards]]
condition = "ctx.all_children_stopped()"
target = "stop"

# ShuttingDown state — catch-alls (Started/Alive/registrations are absorbed).
# Coverage here is partial (no Started/Alive Child rules, no registration
# Control rules), so the codegen keeps these in the emitted spec.
[[topology.transitions]]
state = "ShuttingDown"
event = "SupervisorEvent::Child(_)"
target = "stay"

[[topology.transitions]]
state = "ShuttingDown"
event = "SupervisorEvent::Control(_)"
target = "stay"

# Entry actions
[[topology.entry]]
state = "Running"
actions = ["Self::start_children"]

[[topology.entry]]
state = "ShuttingDown"
actions = ["Self::stop_all_children"]

# State declarations
[[topology.states]]
name = "Running"
initial = true

[[topology.states]]
name = "ShuttingDown"
