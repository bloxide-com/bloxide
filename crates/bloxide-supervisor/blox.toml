# Copyright 2025 Bloxide, all rights reserved
[actor]
name = "Supervisor"

# ── Context struct ───────────────────────────────────────────────────────────
# Single unified variant — no dynamic/non-dynamic split.
# The event enum is now generated by the codegen (standard [event] section).

[context]
name = "SupervisorCtx"
generics = "<R: BloxRuntime>"
on_init = "ctx.children.clear_counters(); ctx.pending = ChildAction::default();"

# Explicit imports — only non-framework crates. Framework types (ActorId,
# ActorRef, BloxRuntime) are auto-detected by the codegen from field types.
imports = [
    "bloxide_core::lifecycle::ChildLifecycleEvent",
    "bloxide_child_management::{ChildAction, ChildGroup}",
]

# Extra impl blocks emitted after the struct. {ctx} is replaced with the
# actual ctx type (SupervisorCtx<R>).
extra_impls = [
    "{ctx} { pub fn all_children_stopped(&self) -> bool { self.children.all_stopped() } }",
]

# ── Action declarations ─────────────────────────────────────────────────────
# Each action is a free function in crate::actions that takes concrete params.
# The codegen generates wrapper closures that extract ctx fields and call them.

[[context.actions]]
name = "start_children"
crate = "bloxide_child_management"
module = "actions"
kind = "entry"
fields = ["self_id", "children:mut", "pending:mut"]

[[context.actions]]
name = "stop_all_children"
crate = "bloxide_child_management"
module = "actions"
kind = "entry"
fields = ["self_id", "children:ref"]

[[context.actions]]
name = "handle_stopped_or_failed"
crate = "bloxide_child_management"
module = "actions"
kind = "transition"
fields = ["self_id", "children:mut", "child_notify:ref", "pending:mut"]
event_payload = "ev"

[[context.actions]]
name = "record_started"
crate = "bloxide_child_management"
module = "actions"
kind = "transition"
fields = ["children:mut"]
event_payload = "ev"

[[context.actions]]
name = "record_stopped"
crate = "bloxide_child_management"
module = "actions"
kind = "transition"
fields = ["children:mut"]
event_payload = "ev"

[[context.actions]]
name = "record_aborted"
crate = "bloxide_child_management"
module = "actions"
kind = "transition"
fields = ["children:mut"]
event_payload = "ev"

[[context.actions]]
name = "record_killed"
crate = "bloxide_child_management"
module = "actions"
kind = "transition"
fields = ["children:mut"]
event_payload = "ev"

[[context.actions]]
name = "record_alive"
crate = "bloxide_child_management"
module = "actions"
kind = "transition"
fields = ["children:mut"]
event_payload = "ev"

[[context.actions]]
name = "deregister_done"
crate = "bloxide_child_management"
module = "actions"
kind = "transition"
fields = ["children:mut", "pending:mut"]
event_payload = "ev"

[[context.actions]]
name = "register_child"
crate = "bloxide_child_management"
module = "actions"
kind = "transition"
fields = ["self_id", "children:mut"]
event_payload = "ctrl"

[[context.actions]]
name = "handle_register_dynamic_child"
crate = "bloxide_child_management"
module = "actions"
kind = "transition"
fields = ["self_id", "children:mut"]
event_payload = "ctrl"

[[context.actions]]
name = "handle_health_check"
crate = "bloxide_child_management"
module = "actions"
kind = "transition"
fields = ["self_id", "children:mut", "child_notify:ref", "pending:mut"]
event_payload = "ctrl"

# ── Event type (standard codegen-generated event enum) ──────────────────────

[event]
name = "SupervisorEvent"
generics = "<R: BloxRuntime>"

[[event.mailboxes]]
variant = "Child"
message = "ChildLifecycleEvent"
message_path = "bloxide_core::lifecycle::ChildLifecycleEvent"

[[event.mailboxes]]
variant = "Control"
message = "ChildCtrl"
message_path = "bloxide_child_management::control::ChildCtrl<R>"

# ── Context fields (via composable context crates) ──────────────────────────

# children: ChildGroup<R> from bloxide-child-management
[[context.uses]]
crate = "bloxide_child_management"
field = "children"
field_type = "ChildGroup<R>"
role = "ctor"

# child_notify: ActorRef<ChildLifecycleEvent, R> from bloxide-child-management
[[context.uses]]
crate = "bloxide_child_management"
field = "child_notify"
field_type = "ActorRef<ChildLifecycleEvent, R>"
role = "ctor"

# pending: ChildAction — state field
[[context.uses]]
crate = "bloxide_child_management"
fields = [
    { name = "pending", ty = "ChildAction", role = "state" },
]

# ── Topology ─────────────────────────────────────────────────────────────────
# 2 states, fully declarative — no handler_fns.

[topology]
spec_imports = [
    "bloxide_child_management::ChildAction",
]

# Running state — lifecycle handling
[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Child(Envelope(_, ChildLifecycleEvent::Stopped { .. }))"
target = "stay"
actions = ["Self::handle_stopped_or_failed"]
guards = [{ condition = "ctx.pending == ChildAction::BeginShutdown", target = "ShuttingDown" }]

[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Child(Envelope(_, ChildLifecycleEvent::Failed { .. }))"
target = "stay"
actions = ["Self::handle_stopped_or_failed"]
guards = [{ condition = "ctx.pending == ChildAction::BeginShutdown", target = "ShuttingDown" }]

[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Child(Envelope(_, ChildLifecycleEvent::Started { .. }))"
target = "stay"
actions = ["Self::record_started"]

[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Child(Envelope(_, ChildLifecycleEvent::Aborted { .. }))"
target = "stay"
actions = ["Self::record_aborted"]

[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Child(Envelope(_, ChildLifecycleEvent::Killed { .. }))"
target = "stay"
actions = ["Self::record_killed"]

[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Child(Envelope(_, ChildLifecycleEvent::Alive { .. }))"
target = "stay"
actions = ["Self::record_alive"]

[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Child(Envelope(_, ChildLifecycleEvent::Done { .. }))"
target = "stay"
actions = ["Self::deregister_done"]
guards = [{ condition = "ctx.pending == ChildAction::BeginShutdown", target = "ShuttingDown" }]

[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Control(Envelope(_, ChildCtrl::RegisterChild(_)))"
target = "stay"
actions = ["Self::register_child"]

[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Control(Envelope(_, ChildCtrl::RegisterDynamicChild(_)))"
target = "stay"
actions = ["Self::handle_register_dynamic_child"]

[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Control(Envelope(_, ChildCtrl::HealthCheckTick))"
target = "stay"
actions = ["Self::handle_health_check"]
guards = [{ condition = "ctx.pending == ChildAction::BeginShutdown", target = "ShuttingDown" }]

# Running state — catch-alls
[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Child(_)"
target = "stay"

[[topology.transitions]]
state = "Running"
event = "SupervisorEvent::Control(_)"
target = "stay"

# ShuttingDown state
[[topology.transitions]]
state = "ShuttingDown"
event = "SupervisorEvent::Child(Envelope(_, ChildLifecycleEvent::Stopped { .. }))"
target = "stay"
actions = ["Self::record_stopped"]
guards = [{ condition = "ctx.all_children_stopped()", target = "stop" }]

[[topology.transitions]]
state = "ShuttingDown"
event = "SupervisorEvent::Child(Envelope(_, ChildLifecycleEvent::Done { .. }))"
target = "stay"
actions = ["Self::deregister_done"]
guards = [{ condition = "ctx.all_children_stopped()", target = "stop" }]

[[topology.transitions]]
state = "ShuttingDown"
event = "SupervisorEvent::Child(_)"
target = "stay"

[[topology.transitions]]
state = "ShuttingDown"
event = "SupervisorEvent::Control(_)"
target = "stay"

# Entry actions
[[topology.entry]]
state = "Running"
actions = ["Self::start_children"]

[[topology.entry]]
state = "ShuttingDown"
actions = ["Self::stop_all_children"]

# State declarations
[[topology.states]]
name = "Running"
initial = true

[[topology.states]]
name = "ShuttingDown"
