[package]
name = "bloxide-supervisor"
version.workspace = true
edition.workspace = true
description = "OTP-style supervision for bloxide — no_std"
repository.workspace = true
license.workspace = true

[features]
default = []
std     = ["bloxide-core/std"]

[dependencies]
bloxide-core = { workspace = true }
bloxide-child-management = { workspace = true }

[dev-dependencies]
bloxide-core = { workspace = true, features = ["std"] }
bloxide-test-runtime = { workspace = true }
bloxide-spawn = { workspace = true, features = ["std"] }
