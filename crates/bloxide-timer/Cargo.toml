# Copyright 2025 Bloxide, all rights reserved
[package]
name = "bloxide-timer"
version.workspace = true
edition.workspace = true
description = "Timer service for bloxide — messages, queue, actions, and TimerService trait"
repository.workspace = true
license.workspace = true

[features]
std = ["bloxide-core/std", "dep:bloxide-test-runtime"]

[dependencies]
bloxide-core = { workspace = true }
bloxide-log = { workspace = true }
critical-section = "1.2.0"
bloxide-test-runtime = { workspace = true, optional = true }

[dev-dependencies]
# Also a dev-dependency so the VirtualClock unit tests run under plain
# `cargo test -p bloxide-timer` (the std feature stays off by default).
bloxide-test-runtime = { workspace = true }
