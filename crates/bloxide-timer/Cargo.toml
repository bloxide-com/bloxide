[package]
name = "bloxide-timer"
version.workspace = true
edition.workspace = true
description = "Timer service for bloxide — messages, queue, actions, and TimerService trait"
repository.workspace = true
license.workspace = true

[features]
std = ["bloxide-core/std", "dep:bloxide-test-runtime"]

[dependencies]
# alloc is unconditional: TimerQueue and the action functions use alloc
# types (Vec, Box) on every target, so bloxide-core/alloc is always on.
bloxide-core = { workspace = true, features = ["alloc"] }
bloxide-log = { workspace = true }
critical-section = "1.2.0"
bloxide-test-runtime = { workspace = true, optional = true }
