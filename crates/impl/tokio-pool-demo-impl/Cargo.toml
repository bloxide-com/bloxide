[package]
name = "tokio-pool-demo-impl"
version = "0.0.3"
edition = "2021"
description = "Concrete worker factory for the Tokio pool demo"
publish = false
license = "MIT"

# This crate is NOT a root-workspace member (root Cargo.toml `exclude`): it
# path-depends into target/bloxide-generated/, which only exists after
# `cargo blox generate`, and the root workspace must load before that. Cargo
# forbids membership in the generated workspace too (members must be
# hierarchically below the workspace root), so it builds as a path dependency
# of the generated example crates and `cargo blox test` runs its tests via
# --manifest-path. Not being in any workspace, it cannot use
# `workspace = true` inheritance — versions and paths are explicit.

[dependencies]
bloxide-core = { path = "../../bloxide-core", features = ["std"] }
bloxide-child-management = { path = "../../bloxide-child-management", features = ["std"] }
bloxide-spawn = { path = "../../bloxide-spawn", features = ["std"] }
bloxide-peers = { path = "../../bloxide-peers" }
bloxide-tokio = { path = "../../../runtimes/bloxide-tokio" }
blox-ctx-pool-ref = { path = "../../context/blox-ctx-pool-ref" }
pool-messages = { path = "../../messages/pool-messages" }
worker-blox = { path = "../../../target/bloxide-generated/crates/worker-blox", features = ["std"] }

[features]
dynamic = []

[dev-dependencies]
bloxide-core = { path = "../../bloxide-core", features = ["std"] }
bloxide-child-management = { path = "../../bloxide-child-management", features = ["std"] }
bloxide-tokio = { path = "../../../runtimes/bloxide-tokio" }
pool-blox = { path = "../../../target/bloxide-generated/crates/pool-blox", features = ["std", "dynamic"] }
pool-messages = { path = "../../messages/pool-messages" }
tokio = { version = "1", features = ["full"] }
