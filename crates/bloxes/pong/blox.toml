[actor]
name = "Pong"

[context]
name = "PongCtx"
generics = "<R: BloxRuntime>"
imports = [
    "ping_pong_messages::PingPongMsg",
]

# Accessor traits removed — fields are now plain struct fields.
[[context.uses]]
crate = "bloxide_messaging"
field = "peer_ref"
field_type = "ActorRef<PingPongMsg, R>"
role = "ctor"

# --- Action declarations (Phase 3 system codegen) ---

[[context.actions]]
name = "reply_pong_action"
fn_name = "send_pong"
crate = "bloxide_messaging"
kind = "transition"
fields = ["self_id", "peer_ref:ref"]
event_payload = "ping"
impl_required = false

[event]
name = "PongEvent"

[[event.mailboxes]]
variant = "Msg"
message = "PingPongMsg"
message_path = "ping_pong_messages::PingPongMsg"

[topology]

[[topology.states]]
name = "Ready"
initial = true

[[topology.transitions]]
state = "Ready"
event = "PingPongMsg::Ping(_)"
target = "stay"
actions = ["Self::reply_pong_action"]
