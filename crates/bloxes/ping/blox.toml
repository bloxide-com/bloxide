[actor]
name = "Ping"

[context]
name = "PingCtx"
generics = "<R: BloxRuntime>"
on_init = "ctx.round = 0; ctx.current_timer = None;"
imports = [
    "ping_pong_messages::PingPongMsg",
    "bloxide_timer::{TimerCommand, TimerId}",
    "blox_ctx_current_timer::HasCurrentTimer",
    "blox_ctx_rounds::CountsRounds",
]
extra_impls = [
    "HasCurrentTimer for {ctx} { fn current_timer(&self) -> Option<TimerId> { self.current_timer } fn set_current_timer(&mut self, t: Option<TimerId>) { self.current_timer = t; } }",
    "CountsRounds for {ctx} { type Round = u32; fn round(&self) -> u32 { self.round } fn set_round(&mut self, r: u32) { self.round = r; } }",
]

# Accessor traits from bloxide-messaging (2-param, require #[provides])
[[context.uses]]
crate = "bloxide_messaging"
trait = "HasPeerRef<R, PingPongMsg>"
field = "peer_ref"
field_type = "ActorRef<PingPongMsg, R>"
role = "accessor"

[[context.uses]]
crate = "bloxide_messaging"
trait = "HasSelfRef<R, PingPongMsg>"
field = "self_ref"
field_type = "ActorRef<PingPongMsg, R>"
role = "accessor"

# Accessor trait from bloxide-timer (1-param, convention-based inference works)
[[context.uses]]
crate = "bloxide_timer"
trait = "HasTimerRef<R>"
field = "timer_ref"
field_type = "ActorRef<TimerCommand, R>"
role = "accessor"

# State fields (moved from B into Ctx)
[[context.fields]]
name = "current_timer"
type = "Option<TimerId>"

[[context.fields]]
name = "round"
type = "u32"

# --- Action declarations (Phase 3 system codegen) ---

[[context.actions]]
name = "increment_round"
crate = "blox_ctx_rounds"
kind = "transition"
fields = ["round:mut"]
impl_required = false

[[context.actions]]
name = "send_initial_ping"
crate = "bloxide_messaging"
kind = "transition"
fields = ["self_id", "peer_ref:ref", "round"]
impl_required = false

[[context.actions]]
name = "forward_ping"
fn_name = "send_ping"
crate = "bloxide_messaging"
kind = "transition"
fields = ["self_id", "peer_ref:ref", "round"]
impl_required = false

[[context.actions]]
name = "schedule_pause_timer"
fn_name = "schedule_resume"
crate = "blox_ctx_current_timer"
kind = "transition"
fields = ["self_id", "self_ref:ref", "timer_ref:ref", "round", "current_timer:mut"]
impl_required = false

[[context.actions]]
name = "cancel_pause_timer"
fn_name = "cancel_timer_by_id"
crate = "blox_ctx_current_timer"
kind = "transition"
fields = ["self_id", "timer_ref:ref", "current_timer:mut"]
impl_required = false

[event]
name = "PingEvent"

[[event.mailboxes]]
variant = "Msg"
message = "PingPongMsg"
message_path = "ping_pong_messages::PingPongMsg"

[topology]
spec_imports = [
    "bloxide_core::transition::ActionResult",
    "crate::{MAX_ROUNDS, PAUSE_AT_ROUND}",
]

[[topology.states]]
name = "Operating"
composite = true

[[topology.states]]
name = "Active"
parent = "Operating"
initial = true

[[topology.states]]
name = "Paused"
parent = "Operating"

[[topology.states]]
name = "Error"
error = true

# --- Declarative transitions ---

# Operating: composite state, catches Pong to prevent bubbling
[[topology.transitions]]
state = "Operating"
event = "PingPongMsg::Pong(_)"
target = "stay"

# Active: entry increments round, logs, sends ping; handles Pong with guards
[[topology.entry]]
state = "Active"
actions = ["Self::increment_round", "Self::send_initial_ping"]

[[topology.transitions]]
state = "Active"
event = "PingPongMsg::Pong(_)"
target = "Active"
actions = ["Self::forward_ping"]

[[topology.transitions.guards]]
condition = "results.any_failed()"
target = "Error"

[[topology.transitions.guards]]
condition = "ctx.round >= MAX_ROUNDS as u32"
target = "stop"

[[topology.transitions.guards]]
condition = "ctx.round == PAUSE_AT_ROUND as u32"
target = "Paused"

# Paused: entry schedules timer, exit cancels it; Resume → Active
[[topology.entry]]
state = "Paused"
actions = ["Self::schedule_pause_timer"]

[[topology.exit]]
state = "Paused"
actions = ["Self::cancel_pause_timer"]

[[topology.transitions]]
state = "Paused"
event = "PingPongMsg::Resume(_)"
target = "Active"
actions = ["Self::forward_ping"]

# Error: entry logs error
[[topology.entry]]
state = "Error"
actions = []
