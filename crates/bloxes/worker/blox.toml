[actor]
name = "Worker"

[event]
name = "WorkerEvent"
generics = "<R: BloxRuntime>"
derives = []

[[event.mailboxes]]
variant = "Ctrl"
message = "PeerCtrl<WorkerMsg>"
message_path = "bloxide_peers::PeerCtrl<pool_messages::WorkerMsg, R>"

[[event.mailboxes]]
variant = "Msg"
message = "WorkerMsg"
message_path = "pool_messages::WorkerMsg"

[topology]

[[topology.states]]
name = "Waiting"
initial = true

[context]
name = "WorkerCtx"
generics = "<R: BloxRuntime>"
on_init = "ctx.task_id = 0; ctx.result = 0; ctx.peers.clear();"
imports = [
    "pool_messages::{PoolMsg, WorkerMsg}",
    "alloc::vec::Vec",
]

# Accessor trait from context crate (1-param, convention-based inference works)
[[context.uses]]
crate = "blox_ctx_pool_ref"
trait = "HasPoolRef<R>"
field = "pool_ref"
field_type = "ActorRef<PoolMsg, R>"
role = "accessor"

# Accessor for peers state field
[[context.uses]]
crate = "bloxide_peers"
trait = "HasPeers<WorkerMsg, R>"
field = "peers"
field_type = "Vec<ActorRef<WorkerMsg, R>>"
role = "accessor"

# Accessor for current task state field
[[context.uses]]
crate = "blox_ctx_current_task"
trait = "HasCurrentTask"
field = "task_id"
field_type = "u32"
role = "accessor"

# State fields (moved from B into Ctx)
[[context.fields]]
name = "task_id"
type = "u32"

[[context.fields]]
name = "result"
type = "u32"

[[context.fields]]
name = "peers"
type = "Vec<ActorRef<WorkerMsg, R>>"

# --- Declarative transitions ---

# Waiting: entry logs; handles ctrl (AddPeer/RemovePeer), DoWork → stop, PeerResult stays
[[topology.entry]]
state = "Waiting"
actions = ["Self::log_waiting"]

[[topology.transitions]]
state = "Waiting"
event = "PeerCtrl::AddPeer(_) | PeerCtrl::RemovePeer(_)"
target = "stay"
actions = ["Self::handle_ctrl"]

[[topology.transitions]]
state = "Waiting"
event = "WorkerMsg::DoWork(_)"
target = "stop"
actions = ["Self::process_work", "Self::log_done", "Self::do_broadcast", "Self::do_notify_pool"]

[[topology.transitions]]
state = "Waiting"
event = "WorkerMsg::PeerResult(_)"
target = "stay"

