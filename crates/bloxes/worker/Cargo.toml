[package]
name = "worker-blox"
version.workspace = true
edition.workspace = true
description = "Worker actor blox for the pool example — runtime-agnostic"
repository.workspace = true
license.workspace = true

[features]
default = ["std"]
std = [
    "bloxide-core/std",
]

[dependencies]
bloxide-core    = { workspace = true, features = ["alloc"] }
bloxide-peers   = { workspace = true }
pool-messages   = { workspace = true }
blox-ctx-pool-ref     = { workspace = true }

[dev-dependencies]
bloxide-core    = { workspace = true, features = ["std"] }
bloxide-test-runtime = { workspace = true }
