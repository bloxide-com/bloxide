[actor]
name = "Counter"

[context]
name = "CounterCtx"
on_init = "ctx.count = 0;"

# State fields (moved from B into Ctx)
[[context.fields]]
name = "count"
type = "u32"

[event]
name = "CounterEvent"

[[event.mailboxes]]
variant = "Msg"
message = "CounterMsg"
message_path = "counter_messages::CounterMsg"

[topology]

[[topology.states]]
name = "Ready"
initial = true

# --- Declarative transitions ---

[[topology.transitions]]
state = "Ready"
event = "CounterMsg::Tick(_)"
target = "stay"
actions = ["Self::count_tick"]

[[topology.transitions.guards]]
condition = "ctx.count >= 2"
target = "stop"

[[topology.transitions.guards]]
condition = "_"
target = "stay"
