[actor]
name = "BhsmTst"

[context]
name = "BhsmTstCtx"
generics = ""

# --- Action declarations (Phase 3 system codegen) ---
# All BHSM actions are entry/exit trace functions, previously logging-only.
# They are now no-ops (no fields, no impl required).

[[context.actions]]
name = "s_entry"
crate = "bloxide_core"
kind = "entry"
fields = []
impl_required = false

[[context.actions]]
name = "s_exit"
crate = "bloxide_core"
kind = "exit"
fields = []
impl_required = false

[[context.actions]]
name = "s_i"
crate = "bloxide_core"
kind = "transition"
fields = []
impl_required = false

[[context.actions]]
name = "s1_entry"
crate = "bloxide_core"
kind = "entry"
fields = []
impl_required = false

[[context.actions]]
name = "s1_exit"
crate = "bloxide_core"
kind = "exit"
fields = []
impl_required = false

[[context.actions]]
name = "s11_entry"
crate = "bloxide_core"
kind = "entry"
fields = []
impl_required = false

[[context.actions]]
name = "s11_exit"
crate = "bloxide_core"
kind = "exit"
fields = []
impl_required = false

[[context.actions]]
name = "s11_a"
crate = "bloxide_core"
kind = "transition"
fields = []
impl_required = false

[[context.actions]]
name = "s11_b"
crate = "bloxide_core"
kind = "transition"
fields = []
impl_required = false

[[context.actions]]
name = "s2_entry"
crate = "bloxide_core"
kind = "entry"
fields = []
impl_required = false

[[context.actions]]
name = "s2_exit"
crate = "bloxide_core"
kind = "exit"
fields = []
impl_required = false

[[context.actions]]
name = "s21_entry"
crate = "bloxide_core"
kind = "entry"
fields = []
impl_required = false

[[context.actions]]
name = "s21_exit"
crate = "bloxide_core"
kind = "exit"
fields = []
impl_required = false

[[context.actions]]
name = "s211_entry"
crate = "bloxide_core"
kind = "entry"
fields = []
impl_required = false

[[context.actions]]
name = "s211_exit"
crate = "bloxide_core"
kind = "exit"
fields = []
impl_required = false

[[context.actions]]
name = "error_entry"
crate = "bloxide_core"
kind = "entry"
fields = []
impl_required = false

[[context.actions]]
name = "error_exit"
crate = "bloxide_core"
kind = "exit"
fields = []
impl_required = false

[event]
name = "BhsmTstEvent"

[[event.mailboxes]]
variant = "Msg"
message = "BhsmTstMsg"
message_path = "bhsm_tst_messages::BhsmTstMsg"

[topology]
[[topology.states]]
name = "S"
composite = true

[[topology.states]]
name = "S1"
parent = "S"
composite = true

[[topology.states]]
name = "S11"
parent = "S1"

[[topology.states]]
name = "S2"
parent = "S"
composite = true

[[topology.states]]
name = "S21"
parent = "S2"
composite = true

[[topology.states]]
name = "S211"
parent = "S21"

[[topology.states]]
name = "Error"
error = true

# --- Declarative transitions ---

# S: entry/exit trace, H→S11, I→stay, K→Error, X→stop
[[topology.entry]]
state = "S"
actions = ["Self::s_entry"]

[[topology.exit]]
state = "S"
actions = ["Self::s_exit"]

[[topology.transitions]]
state = "S"
event = "BhsmTstMsg::H(_)"
target = "S11"

[[topology.transitions]]
state = "S"
event = "BhsmTstMsg::I(_)"
target = "stay"
actions = ["Self::s_i"]

[[topology.transitions]]
state = "S"
event = "BhsmTstMsg::K(_)"
target = "Error"

[[topology.transitions]]
state = "S"
event = "BhsmTstMsg::X(_)"
target = "stop"

# S1: entry/exit trace, C→S211
[[topology.entry]]
state = "S1"
actions = ["Self::s1_entry"]

[[topology.exit]]
state = "S1"
actions = ["Self::s1_exit"]

[[topology.transitions]]
state = "S1"
event = "BhsmTstMsg::C(_)"
target = "S211"

# S11: entry/exit trace, A→S11, B→S11, D→S211
[[topology.entry]]
state = "S11"
actions = ["Self::s11_entry"]

[[topology.exit]]
state = "S11"
actions = ["Self::s11_exit"]

[[topology.transitions]]
state = "S11"
event = "BhsmTstMsg::A(_)"
target = "S11"
actions = ["Self::s11_a"]

[[topology.transitions]]
state = "S11"
event = "BhsmTstMsg::B(_)"
target = "S11"
actions = ["Self::s11_b"]

[[topology.transitions]]
state = "S11"
event = "BhsmTstMsg::D(_)"
target = "S211"

# S2: entry/exit trace, no transitions (bubbles to S)
[[topology.entry]]
state = "S2"
actions = ["Self::s2_entry"]

[[topology.exit]]
state = "S2"
actions = ["Self::s2_exit"]

# S21: entry/exit trace, E→S211, G→S11
[[topology.entry]]
state = "S21"
actions = ["Self::s21_entry"]

[[topology.exit]]
state = "S21"
actions = ["Self::s21_exit"]

[[topology.transitions]]
state = "S21"
event = "BhsmTstMsg::E(_)"
target = "S211"

[[topology.transitions]]
state = "S21"
event = "BhsmTstMsg::G(_)"
target = "S11"

# S211: entry/exit trace, F→S11
[[topology.entry]]
state = "S211"
actions = ["Self::s211_entry"]

[[topology.exit]]
state = "S211"
actions = ["Self::s211_exit"]

[[topology.transitions]]
state = "S211"
event = "BhsmTstMsg::F(_)"
target = "S11"

# Error: entry/exit trace, no transitions
[[topology.entry]]
state = "Error"
actions = ["Self::error_entry"]

[[topology.exit]]
state = "Error"
actions = ["Self::error_exit"]

